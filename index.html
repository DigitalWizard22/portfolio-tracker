<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F1420;--card:#151C2C;--chip:#1B2438;--ink:#F2F5FA;--mut:#8C97AD;--line:#232D44;--sky:#3BB0F0;--blue:#3B82F6;--c3:#B58CF0;--teal:#5CC4A8;--up:#5CC4A8;--down:#F06B5A;--upbg:rgba(92,196,168,.15);--downbg:rgba(240,107,90,.15);--g1:#47B8F5;--g2:#2F66E6;--warn:#E0A526;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#EEF2F8;--card:#FFFFFF;--chip:#E4EAF4;--ink:#101828;--mut:#5F6B82;--line:#D9E0EC;--sky:#1C8FD0;--c3:#7B5CD6;--up:#1E9A7A;--down:#D9473A;--upbg:rgba(30,154,122,.12);--downbg:rgba(217,71,58,.12);--warn:#B7791F;color-scheme:light}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.35}
main{max-width:480px;margin:0 auto;padding:20px 16px 48px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
a{color:inherit;text-decoration:none}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.top h1{font-size:24px;font-weight:800;margin:0;flex:1}
.back{width:40px;height:40px;border-radius:12px;background:var(--chip);display:grid;place-items:center;font-size:20px}
.hero{border-radius:28px;padding:22px;background:linear-gradient(120deg,var(--g1),var(--g2));color:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px}
.hero small{font-size:15px;opacity:.9;font-weight:500}
.hero .big{font-size:clamp(30px,9vw,38px);font-weight:800;letter-spacing:-.02em}
.plus{width:56px;height:56px;border-radius:50%;background:#fff;color:#2F8FE8;font-size:32px;font-weight:500;display:grid;place-items:center;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;margin-top:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.lbl{color:var(--mut);font-size:14px;font-weight:500}
.val{font-size:22px;font-weight:800;margin-top:2px}
.up{color:var(--up)}.down{color:var(--down)}
.pill{display:inline-block;padding:3px 12px;border-radius:99px;font-size:14px;font-weight:700;margin-top:6px}
.pill.up{background:var(--upbg)}.pill.down{background:var(--downbg)}.pill.neutral{background:var(--chip);color:var(--ink)}
h2{font-size:22px;font-weight:800;margin:0}
.mix{display:flex;align-items:center;gap:22px;margin-top:14px}
.pie{width:128px;height:128px;border-radius:50%;flex:none}
.leg{flex:1;display:grid;gap:12px;font-size:15px}
.leg div{display:flex;align-items:center;gap:8px}
.leg i{width:12px;height:12px;border-radius:50%;flex:none}
.leg b{margin-left:auto}
.sechead{display:flex;justify-content:space-between;align-items:center;margin:26px 0 12px}
.btn{background:var(--sky);color:#06202E;font-weight:800;border-radius:99px;padding:11px 20px;min-height:44px}
.btn.soft{background:var(--chip);color:var(--ink)}
.acct{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 16px;margin-bottom:12px;border-left:5px solid var(--down)}
.acct.gain{border-left-color:var(--up)}
.ico{width:52px;height:52px;border-radius:16px;background:var(--chip);display:grid;place-items:center;color:var(--sky);font-weight:800;font-size:22px;flex:none}
.acct .t{font-weight:800;font-size:19px}
.acct .r{margin-left:auto;text-align:right}
.cols{display:grid;grid-template-columns:1.5fr 1fr 1fr 24px;gap:8px;color:var(--mut);font-size:14px;padding:0 6px;margin-bottom:8px}
.cols span:nth-child(2),.cols span:nth-child(3){text-align:right}
.hold{background:var(--card);border:1px solid var(--line);border-radius:20px;margin-bottom:12px;overflow:hidden}
.hrow{display:grid;grid-template-columns:1.5fr 1fr 1fr 24px;gap:8px;align-items:center;width:100%;text-align:left;padding:14px 12px 14px 14px;min-height:64px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:40px;height:40px;border-radius:50%;background:var(--g2);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.tk{font-weight:800;color:var(--sky)}
.nm{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid,.pl{text-align:right;font-weight:700}
.mid small{display:block;color:var(--mut);font-weight:500}
.edit{display:none;grid-template-columns:1fr 1fr;gap:10px;padding:4px 14px 16px}
.hold.open .edit{display:grid}
.hold.open .chev{transform:rotate(180deg)}
.chev{transition:transform .15s}
.edit label,.sheet label{font-size:12px;color:var(--mut);display:block;margin-bottom:3px}
input,select{width:100%;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px}
.del{grid-column:1/-1;color:var(--down);font-weight:700;min-height:40px}
.empty{color:var(--mut);text-align:center;padding:24px}
.note{color:var(--mut);font-size:13px;margin-top:18px}
.tabs{display:flex;gap:8px;margin:0 0 14px}.tabs a{padding:8px 16px;border-radius:99px;background:var(--chip);font-weight:700;font-size:14px}.tabs a.on{background:var(--sky);color:#06202E}.x{color:var(--mut);padding:8px;min-height:40px;font-size:16px}
@media(min-width:1024px){main{max-width:1280px;padding:24px 32px 64px}main.narrow{max-width:640px}}
.dtop{display:flex;align-items:center;gap:16px;margin-bottom:18px}.dtop h1{font-size:26px;font-weight:800;margin:0}.grow{flex:1}
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border:1px solid var(--line);border-radius:20px}
.stat{display:flex;align-items:center;gap:14px;padding:18px 22px;border-left:1px solid var(--line)}.stat:first-child{border-left:0}
.sico{width:44px;height:44px;border-radius:50%;background:var(--chip);display:grid;place-items:center;color:var(--sky);font-weight:800;flex:none}
.sv{font-size:22px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.sv .pill{margin:0;font-size:12px}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;margin-top:20px;align-items:start}
.chips{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.chip{padding:9px 16px;border-radius:99px;background:var(--chip);font-weight:700;font-size:14px}.chip.on{background:var(--sky);color:#06202E}
.thead,.trow{display:grid;grid-template-columns:2.3fr 1fr 1fr .8fr 1.3fr 1.3fr 1.5fr 1.2fr;gap:10px;align-items:center}
.thead{color:var(--mut);font-size:13px;font-weight:600;padding:0 18px 8px}.thead span+span,.trow>div+div{text-align:right}
.trow{padding:14px 18px;min-height:68px;font-weight:600}.trow small{display:block;color:var(--mut);font-weight:500;font-size:12px}.trow small.up{color:var(--up)}.trow small.down{color:var(--down)}
.hold .edit.wide{grid-template-columns:repeat(5,1fr);align-items:end;padding:6px 18px 18px}
.donut{width:200px;height:200px;border-radius:50%;margin:12px auto 0;position:relative}.donut::after{content:"";position:absolute;inset:26px;border-radius:50%;background:var(--card)}.dc{position:absolute;inset:0;display:grid;place-content:center;text-align:center;z-index:1}
.dleg{display:grid;gap:10px;margin-top:16px;font-size:14px}.dleg div{display:flex;align-items:center;gap:8px}.dleg i{width:10px;height:10px;border-radius:50%;flex:none}.dleg b{margin-left:auto}
.tools{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}.txp{grid-column:1/-1}.txl{display:grid;gap:4px;margin-top:10px;font-size:13px;color:var(--mut)}.txl div{display:flex;align-items:center;justify-content:space-between}.txl .x{min-height:28px;padding:2px 8px}
.warn{color:var(--warn)}.mk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mut);font-weight:600}.mk i{width:8px;height:8px;border-radius:50%}
.sheet{position:fixed;inset:0;background:rgba(5,8,15,.6);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.open{display:flex}
.sheet .in{background:var(--card);width:100%;max-width:480px;border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:1fr 1fr;gap:12px;max-height:92vh;overflow:auto}
.sheet h3{grid-column:1/-1;margin:0;font-size:20px}
.sheet .full{grid-column:1/-1}
.sheet .acts{grid-column:1/-1;display:flex;gap:10px}.sheet .acts button{flex:1}
</style>
</head>
<body>
<main id="app"></main>
<div class="sheet" id="sheet"><div class="in">
  <h3>Add holding</h3>
  <div><label for="fKind">Type</label><select id="fKind"><option value="stock">Stock</option><option value="fund">Fund</option></select></div>
  <div><label for="fMkt">Market</label><select id="fMkt"><option value="PH">Philippines (₱)</option><option value="US">US ($)</option></select></div>
  <div><label for="fTicker">Ticker</label><input id="fTicker" placeholder="e.g. RCR"></div>
  <div><label for="fName">Name</label><input id="fName" placeholder="e.g. RL Commercial REIT"></div>
  <div><label for="fShares">Shares or units</label><input id="fShares" type="number" step="any" min="0" inputmode="decimal"></div>
  <div><label for="fAvg">Average price (₱)</label><input id="fAvg" type="number" step="any" min="0" inputmode="decimal"></div>
  <div><label for="fPrice">Price now (₱, optional)</label><input id="fPrice" type="number" step="any" min="0" inputmode="decimal"></div>
  <div><label for="fDiv">Dividend per share a year (₱)</label><input id="fDiv" type="number" step="any" min="0" inputmode="decimal"></div>
  <div class="full" id="fBfxW" style="display:none"><label for="fBfx">Rate you bought at (₱ per $)</label><input id="fBfx" type="number" step="any" min="0" inputmode="decimal" placeholder="Leave blank to use today’s rate"></div>
  <div class="acts"><button class="btn soft" id="cancel">Cancel</button><button class="btn" id="save">Save holding</button></div>
</div></div>
<div class="sheet" id="tsheet"><div class="in">
  <h3 id="tTitle">Log transaction</h3>
  <div><label for="tType">Type</label><select id="tType"><option value="buy">Buy</option><option value="sell">Sell</option></select></div>
  <div><label for="tDate">Date</label><input id="tDate" type="date"></div>
  <div><label for="tShares">Shares or units</label><input id="tShares" type="number" step="any" min="0" inputmode="decimal"></div>
  <div><label for="tPrice" id="tPriceL">Price per share</label><input id="tPrice" type="number" step="any" min="0" inputmode="decimal"></div>
  <div class="full" id="tRateW" style="display:none"><label for="tRate">Exchange rate (₱ per $), blank = today’s</label><input id="tRate" type="number" step="any" min="0" inputmode="decimal"></div>
  <div class="full"><label for="tFee">Fees &amp; taxes (total), blank = auto</label><input id="tFee" type="number" step="any" min="0" inputmode="decimal"></div>
  <div class="acts"><button class="btn soft" id="tCancel">Cancel</button><button class="btn" id="tSave">Save</button></div>
</div></div>
<div class="sheet" id="dsheet"><div class="in">
  <h3 id="dTitle">Log dividend</h3>
  <div><label for="dDate">Date received</label><input id="dDate" type="date"></div>
  <div><label for="dAmt" id="dAmtL">Amount received, after tax</label><input id="dAmt" type="number" step="any" min="0" inputmode="decimal"></div>
  <div class="full" id="dRateW" style="display:none"><label for="dRate">Exchange rate (₱ per $), blank = today’s</label><input id="dRate" type="number" step="any" min="0" inputmode="decimal"></div>
  <div class="acts"><button class="btn soft" id="dCancel">Cancel</button><button class="btn" id="dSave">Save</button></div>
</div></div>
<div class="sheet" id="ssheet"><div class="in" id="sIn"></div></div>
<input type="file" id="impFile" accept="application/json,.json" hidden>
<script>
const KEY = "portfolio-v2";
const seed = [
  {id:1, kind:"stock", ticker:"GCASH", name:"Mynt, Inc.", shares:100, avg:7.47, price:7.18, div:0},
  {id:2, kind:"stock", ticker:"RCR", name:"RL Commercial REIT", shares:100, avg:5.9979, price:5.95, div:0.4584},
  {id:3, kind:"fund", ticker:"ATRGTEC", name:"ATRAM Global Technology Feeder Fund", shares:2, avg:522.2, price:494.005, div:0}
];
const SDEF = {PH:{comm:.25, min:0, exch:.005, other:.01, vat:12, tax:.1}, US:{comm:0, min:0, exch:0, other:0, vat:0, tax:0}};
let items = load(), openId = null, fx = 58, watchl = [], wq = {}, txs = [], hist = [], divs = [], settings = JSON.parse(JSON.stringify(SDEF));
try { fx = +localStorage.getItem("portfolio-fx") || 58; watchl = JSON.parse(localStorage.getItem("portfolio-watch")) || []; txs = JSON.parse(localStorage.getItem("portfolio-tx")) || []; hist = JSON.parse(localStorage.getItem("portfolio-hist")) || []; divs = JSON.parse(localStorage.getItem("portfolio-div")) || []; const sv = JSON.parse(localStorage.getItem("portfolio-set")); if (sv) settings = {PH:{...SDEF.PH, ...sv.PH}, US:{...SDEF.US, ...sv.US}}; } catch(e){}
items.forEach(applyTx);
const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
const saveW = () => { try { localStorage.setItem("portfolio-watch", JSON.stringify(watchl)); } catch(e){} };
function load(){ try { const s = localStorage.getItem(KEY); if (s) return JSON.parse(s); } catch(e){} return seed.map(x => ({...x})); }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(items)); } catch(e){} }
const $ = id => document.getElementById(id);
const money = n => (n < 0 ? "-" : "") + "₱" + Math.abs(n).toLocaleString("en-PH", {minimumFractionDigits:2, maximumFractionDigits:2});
const signed = n => (n > 0 ? "+" : "") + (n < 0 ? "-" : "") + Math.abs(n).toLocaleString("en-PH", {minimumFractionDigits:2, maximumFractionDigits:2});
const num = n => String(+(+n).toFixed(4)), px = n => String(+(+n).toFixed(n >= 100 ? 2 : 4));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const calc = h => { const us = h.mkt === "US", m = us ? fx : 1, b = us ? (h.bfx || fx) : 1, cost = h.shares * h.avg * b, val = h.shares * h.price * m; return {cost, val, pl:val - cost, pct:cost ? (val - cost) / cost * 100 : 0, day: h.chg ? val - val / (1 + h.chg / 100) : 0, px: h.shares * (h.price - h.avg) * b, cur: h.shares * h.price * (m - b)}; };
const sum = list => { const t = {cost:0, val:0, div:0, day:0, px:0, cur:0, real:0, dall:0, fees:0, estN:0}; list.forEach(h => { const c = calc(h), dv = dvInfo(h); t.real += h.realized || 0; t.fees += h.fees || 0; t.dall += dvAll(h); if (!dv.real && dv.amt) t.estN++; t.cost += c.cost; t.val += c.val; t.day += c.day; t.px += c.px; t.cur += c.cur; t.div += dv.amt; }); t.pl = t.val - t.cost; t.pct = t.cost ? t.pl / t.cost * 100 : 0; return t; };
const pill = p => `<span class="pill ${p >= 0 ? "up" : "down"}">${p >= 0 ? "▲" : "▼"} ${Math.abs(p).toFixed(2)}%</span>`;
const kinds = {stock:{title:"Stock Holdings", sub:"PH Stocks", all:"All Stocks", icon:"₱"}, fund:{title:"Fund Portfolio", sub:"PH Mutual Funds / UITFs", all:"All Funds", icon:"₱"}, us:{title:"US Stocks", sub:"NASDAQ / NYSE, converted to ₱", all:"All US Stocks", icon:"$"}};
const g = h => h.kind === "fund" ? "fund" : h.mkt === "US" ? "us" : "stock", cs = h => h.mkt === "US" ? "$" : "";

const KEYS = ["portfolio-v2","portfolio-watch","portfolio-fx","portfolio-tx","portfolio-hist","portfolio-div","portfolio-set"];
const feeOf = (mkt, type, gross) => { const c = settings[mkt] || {}, cm = Math.max(c.min || 0, gross * (c.comm || 0) / 100), ex = gross * (c.exch || 0) / 100; return cm + ex + (cm + ex) * (c.vat || 0) / 100 + gross * (c.other || 0) / 100 + (type === "sell" ? gross * (c.tax || 0) / 100 : 0); };
const dvOf = h => divs.filter(d => d.hid === h.id);
const dvAll = h => dvOf(h).reduce((a, d) => a + d.php, 0);
const dvInfo = h => { const L = dvOf(h); if (L.length){ const cu = new Date(); cu.setFullYear(cu.getFullYear() - 1); const c = cu.toLocaleDateString("en-CA"); return {amt:L.filter(d => d.date >= c).reduce((a, d) => a + d.php, 0), real:true}; } return {amt:h.shares * h.div * (h.mkt === "US" ? fx : 1), real:false}; };
const MK = {PH:{tz:"Asia/Manila", o:570, c:900, n:"PSE", z:"PHT"}, US:{tz:"America/New_York", o:570, c:960, n:"US market", z:"ET"}};
const ymd = (d, tz) => d.toLocaleDateString("en-CA", {timeZone:tz});
function mnow(m){ const c = MK[m], p = {}; new Intl.DateTimeFormat("en-US", {timeZone:c.tz, weekday:"short", hour:"numeric", minute:"numeric", hour12:false}).formatToParts(new Date()).forEach(x => p[x.type] = x.value); const mins = (+p.hour % 24) * 60 + +p.minute, wk = !["Sat","Sun"].includes(p.weekday); return {c, mins, wk, open: wk && mins >= c.o && mins < c.c}; }
const bdBack = (day, n) => { const d = new Date(day + "T12:00:00Z"); while (n > 0){ d.setUTCDate(d.getUTCDate() - 1); if (![0, 6].includes(d.getUTCDay())) n--; } return d.toISOString().slice(0, 10); };
const lastSession = m => { const s = mnow(m), today = ymd(new Date(), s.c.tz); return s.wk && s.mins >= s.c.o ? today : bdBack(today, 1); };
const dayOf = (a, tz) => { if (!a) return ""; if (/^\d{4}-\d\d-\d\dT/.test(a)) return ymd(new Date(a), tz); const d = new Date(a); return isNaN(d) ? "" : d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const fd = day => new Date(day + "T12:00:00Z").toLocaleDateString("en-US", {month:"short", day:"numeric", timeZone:"UTC"});
function stale(h){ if (!h.asof) return null; const m = h.mkt === "US" ? "US" : "PH", day = dayOf(h.asof, MK[m].tz); if (!day) return null; const need = h.kind === "fund" ? bdBack(lastSession("PH"), 2) : lastSession(m); return day < need ? {day, need} : null; }
const staleMark = h => { const x = stale(h); return x ? `<small class="warn">⚠ as of ${fd(x.day)}</small>` : ""; };
const staleTag = h => { const x = stale(h); return x ? ` <span class="warn">⚠ ${fd(x.day)}</span>` : ""; };
const staleBanner = () => { const L = items.filter(h => stale(h)); return L.length ? `<div class="note warn" style="margin:10px 2px 0">⚠ ${L.length === 1 ? "1 price is" : L.length + " prices are"} older than the last trading day (${L.map(h => h.ticker + " " + fd(stale(h).day)).join(", ")}). That can be a market holiday or a source that hasn’t updated.</div>` : ""; };
const mstrip = () => ["PH","US"].map(m => { const s = mnow(m), c = s.c, t = s.open ? "open" : !s.wk ? "closed · weekend" : s.mins < c.o ? "opens " + Math.floor(c.o / 60) + ":" + String(c.o % 60).padStart(2, "0") + " AM " + c.z : "closed for the day"; return `<span class="mk"><i style="background:${s.open ? "var(--up)" : "var(--mut)"}"></i>${c.n} ${t}</span>`; }).join("");
const retCard = () => { const t = sum(items), tot = t.pl + t.real + t.dall, row = (l, v) => `<div><span>${l}</span><b class="${v >= 0 ? "up" : "down"}">${signed(v)}</b></div>`; return `<div class="card"><h2 style="font-size:18px">Total return</h2><div class="dleg">${row("Price gains (unrealized)", t.px)}${row("Currency (unrealized)", t.cur)}${row("Realized from sells", t.real)}${row("Dividends received", t.dall)}<div style="border-top:1px solid var(--line);padding-top:10px"><span style="font-weight:800">Total incl. dividends</span><b class="${tot >= 0 ? "up" : "down"}">${signed(tot)}</b></div>${t.fees ? `<div><span class="lbl" style="font-size:12px">Fees and taxes already included</span><b class="lbl" style="font-size:12px">${money(t.fees)}</b></div>` : ""}</div></div>`; };
const hasTx = h => txs.some(t => t.hid === h.id);
function applyTx(h){ // weighted-average cost from the transaction log
  const L = txs.filter(t => t.hid === h.id).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.id - b.id);
  if (!L.length) return;
  const us = h.mkt === "US"; let sh = 0, cn = 0, cp = 0, real = 0, fees = 0;
  L.forEach(t => { const r = us ? (t.rate || fx) : 1, fee = t.fee || 0;
    if (t.type === "buy"){ sh += t.shares; cn += t.shares * t.price + fee; cp += (t.shares * t.price + fee) * r; }

    const r = await fetch("/api/prices?t=" + encodeURIComponent(keys.join(",")), {cache:"no-store"}); if (!r.ok) throw new Error("bad status");
    const d = await r.json(), q = d.quotes || {}, good = k => q[k] && q[k].price > 0;
    if (d.fx > 0){ fx = d.fx; try { localStorage.setItem("portfolio-fx", fx); } catch(e){} }
    items.forEach(h => { const k = key(h); if (good(k)){ h.price = q[k].price; if (q[k].chg != null) h.chg = q[k].chg; if (q[k].asof) h.asof = q[k].asof; else delete h.asof; } });
    watchl.forEach(w => { wq[w.m + ":" + w.t] = q[w.m + ":" + w.t] || {}; });
    save();
    const tot = sum(items);
    if (tot.val > 0){
      const day = new Date().toLocaleDateString("en-CA"), b = d.bench || {}, ex = hist.find(x => x.d === day), snap = {d:day, v:Math.round(tot.val * 100) / 100, c:Math.round(tot.cost * 100) / 100, p:b.psei || (ex && ex.p), s:b.spx || (ex && ex.s)};
      if (ex) Object.assign(ex, snap); else hist.push(snap);
      if (hist.length > 800) hist.shift();
      store("portfolio-hist", hist);
    }
    const miss = items.filter(h => !good(key(h))).map(h => h.ticker);
    status = "Live prices updated " + new Date().toLocaleTimeString("en-PH", {hour:"2-digit", minute:"2-digit"}) + (miss.length ? " (no price for " + miss.join(", ") + ")" : "");
    if (!timer) timer = setInterval(() => { if (!document.hidden) refresh(false); }, 60000);
  } catch(e){ if (manual) status = "Couldn’t load live prices. Try again in a moment."; }
  if (!document.activeElement || document.activeElement.tagName !== "INPUT") render();
}
document.addEventListener("click", e => {
  if (e.target.closest("[data-wadd]")){ const t = $("wT").value.trim().toUpperCase(), m = $("wM").value; if (/^[A-Z0-9.\-]{1,10}$/.test(t) && !watchl.some(w => w.t === t && w.m === m)){ watchl.push({t, m}); saveW(); render(); refresh(false); } }
  const x = e.target.closest("[data-wdel]"); if (x){ watchl = watchl.filter(w => w.m + ":" + w.t !== x.dataset.wdel); saveW(); render(); }
});
document.addEventListener("click", e => {
  if (e.target.closest("[data-refresh]")) refresh(true);
  if (e.target.closest("[data-export]")) exportData();
  if (e.target.closest("[data-import]")) $("impFile").click();
  if (e.target.closest("[data-settings]")) openSettings();
  const dv = e.target.closest("[data-div]"); if (dv) openDiv(dv.dataset.div);
  const dd = e.target.closest("[data-divdel]"); if (dd && confirm("Delete this dividend?")){ divs = divs.filter(v => v.id != dd.dataset.divdel); store("portfolio-div", divs); render(); }
  const t = e.target.closest("[data-tx]"); if (t) openTx(t.dataset.tx);
  const x = e.target.closest("[data-txdel]");
  if (x){ const tx = txs.find(v => v.id == x.dataset.txdel); if (tx && confirm("Delete this transaction?")){ txs = txs.filter(v => v.id != tx.id); const h = items.find(v => v.id === tx.hid); if (h) applyTx(h); store("portfolio-tx", txs); save(); render(); } }
});
$("tCancel").onclick = () => $("tsheet").classList.remove("open");
$("tSave").onclick = () => {
  const h = items.find(x => x.id == tHid), shares = parseFloat($("tShares").value), price = parseFloat($("tPrice").value), us = h.mkt === "US";
  if (!(shares > 0) || !(price >= 0)){ $("tShares").focus(); return; }
  if (!hasTx(h) && h.shares > 0) txs.push({id:Date.now() - 1, hid:h.id, date:"0000-00-00", type:"buy", shares:h.shares, price:h.avg, rate:us ? (h.bfx || fx) : undefined});
  const fe = parseFloat($("tFee").value), type = $("tType").value, fee = !isNaN(fe) ? fe : (h.kind === "fund" ? 0 : feeOf(h.mkt || "PH", type, shares * price));
  txs.push({id:Date.now(), hid:h.id, date:$("tDate").value || new Date().toLocaleDateString("en-CA"), type, shares, price, fee, rate:us ? (parseFloat($("tRate").value) || fx) : undefined});
  applyTx(h); store("portfolio-tx", txs); save(); $("tsheet").classList.remove("open"); render();
};
$("impFile").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => { const o = JSON.parse(t); if (o.app !== "portfolio-tracker" || !o["portfolio-v2"]) throw new Error("not a backup"); if (!confirm("Replace everything in this browser with this backup?")) return; KEYS.forEach(k => { if (o[k] != null) localStorage.setItem(k, o[k]); else localStorage.removeItem(k); }); location.reload(); })
   .catch(() => { status = "That file isn’t a valid backup."; render(); });
  e.target.value = "";
};
const prevFee = () => { const h = items.find(x => x.id == tHid); if (!h) return; const gr = (parseFloat($("tShares").value) || 0) * (parseFloat($("tPrice").value) || 0); $("tFee").placeholder = "Auto: " + (h.mkt === "US" ? "$" : "₱") + (h.kind === "fund" ? 0 : feeOf(h.mkt || "PH", $("tType").value, gr)).toFixed(2); };
["tShares","tPrice"].forEach(i => $(i).oninput = prevFee); $("tType").onchange = prevFee;
let dHid = null;
function openDiv(id){ dHid = id; const h = items.find(x => x.id == id), us = h.mkt === "US"; $("dTitle").textContent = "Log dividend · " + h.ticker; $("dAmtL").textContent = "Amount received, after tax (" + (us ? "$" : "₱") + ")"; $("dRateW").style.display = us ? "block" : "none"; $("dDate").value = new Date().toLocaleDateString("en-CA"); $("dAmt").value = ""; $("dRate").value = ""; $("dsheet").classList.add("open"); $("dAmt").focus(); }
$("dCancel").onclick = () => $("dsheet").classList.remove("open");
$("dSave").onclick = () => { const h = items.find(x => x.id == dHid), amt = parseFloat($("dAmt").value), us = h.mkt === "US"; if (!(amt > 0)){ $("dAmt").focus(); return; } const rate = us ? (parseFloat($("dRate").value) || fx) : undefined; divs.push({id:Date.now(), hid:h.id, date:$("dDate").value || new Date().toLocaleDateString("en-CA"), amt, rate, php:amt * (us ? rate : 1)}); store("portfolio-div", divs); $("dsheet").classList.remove("open"); render(); };
const SL = {comm:"Commission %", min:"Minimum commission", exch:"Exchange fee % (VAT applies)", other:"Other fees % (SCCP etc.)", vat:"VAT % on commission + exchange fee", tax:"Sales tax % (sells only)"};
function openSettings(){
  $("sIn").innerHTML = `<h3>Fees &amp; taxes</h3><div class="lbl full" style="font-size:12px">Used to estimate fees when you log a trade. Philippine defaults follow a typical broker schedule: 0.25% commission, 12% VAT, 0.005% PSE fee, 0.01% SCCP and 0.1% sales tax on sells since July 2025. Your broker’s rates may differ, so check them. You can always type the exact fee on a single trade.</div>` + ["PH","US"].map(m => `<h3 style="font-size:16px">${m === "PH" ? "Philippine stocks (₱)" : "US stocks ($)"}</h3>` + Object.keys(SL).map(k => `<div><label>${SL[k]}</label><input type="number" step="any" min="0" inputmode="decimal" data-sm="${m}" data-sk="${k}" value="${settings[m][k]}"></div>`).join("")).join("") + `<div class="acts"><button class="btn soft" id="sReset">Reset</button><button class="btn soft" id="sClose">Close</button><button class="btn" id="sSave">Save</button></div>`;
  $("ssheet").classList.add("open");
}
$("ssheet").addEventListener("click", e => {
  if (e.target.id === "sReset"){ settings = JSON.parse(JSON.stringify(SDEF)); store("portfolio-set", settings); openSettings(); }
  if (e.target.id === "sSave"){ $("sIn").querySelectorAll("[data-sm]").forEach(i => { const v = parseFloat(i.value); settings[i.dataset.sm][i.dataset.sk] = isNaN(v) ? 0 : v; }); store("portfolio-set", settings); $("ssheet").classList.remove("open"); }
  if (e.target.id === "sClose" || e.target === $("ssheet")) $("ssheet").classList.remove("open");
});
render();
refresh(false);
</script>
</body>
</html>
