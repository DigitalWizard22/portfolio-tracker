<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F1420;--card:#151C2C;--chip:#1B2438;--ink:#F2F5FA;--mut:#8C97AD;--line:#232D44;--sky:#3BB0F0;--blue:#3B82F6;--c3:#B58CF0;--teal:#5CC4A8;--up:#5CC4A8;--down:#F06B5A;--upbg:rgba(92,196,168,.15);--downbg:rgba(240,107,90,.15);--g1:#47B8F5;--g2:#2F66E6;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#EEF2F8;--card:#FFFFFF;--chip:#E4EAF4;--ink:#101828;--mut:#5F6B82;--line:#D9E0EC;--sky:#1C8FD0;--c3:#7B5CD6;--up:#1E9A7A;--down:#D9473A;--upbg:rgba(30,154,122,.12);--downbg:rgba(217,71,58,.12);color-scheme:light}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.35}
main{max-width:480px;margin:0 auto;padding:20px 16px 48px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
a{color:inherit;text-decoration:none}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.top h1{font-size:24px;font-weight:800;margin:0;flex:1}
.back{width:40px;height:40px;border-radius:12px;background:var(--chip);display:grid;place-items:center;font-size:20px}
.hero{border-radius:28px;padding:22px;background:linear-gradient(120deg,var(--g1),var(--g2));color:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px}
.hero small{font-size:15px;opacity:.9;font-weight:500}
.hero .big{font-size:clamp(30px,9vw,38px);font-weight:800;letter-spacing:-.02em}
.plus{width:56px;height:56px;border-radius:50%;background:#fff;color:#2F8FE8;font-size:32px;font-weight:500;display:grid;place-items:center;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;margin-top:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.lbl{color:var(--mut);font-size:14px;font-weight:500}
.val{font-size:22px;font-weight:800;margin-top:2px}
.up{color:var(--up)}.down{color:var(--down)}
.pill{display:inline-block;padding:3px 12px;border-radius:99px;font-size:14px;font-weight:700;margin-top:6px}
.pill.up{background:var(--upbg)}.pill.down{background:var(--downbg)}.pill.neutral{background:var(--chip);color:var(--ink)}
h2{font-size:22px;font-weight:800;margin:0}
.mix{display:flex;align-items:center;gap:22px;margin-top:14px}
.pie{width:128px;height:128px;border-radius:50%;flex:none}
.leg{flex:1;display:grid;gap:12px;font-size:15px}
.leg div{display:flex;align-items:center;gap:8px}
.leg i{width:12px;height:12px;border-radius:50%;flex:none}
.leg b{margin-left:auto}
.sechead{display:flex;justify-content:space-between;align-items:center;margin:26px 0 12px}
.btn{background:var(--sky);color:#06202E;font-weight:800;border-radius:99px;padding:11px 20px;min-height:44px}
.btn.soft{background:var(--chip);color:var(--ink)}
.acct{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 16px;margin-bottom:12px;border-left:5px solid var(--down)}
.acct.gain{border-left-color:var(--up)}
.ico{width:52px;height:52px;border-radius:16px;background:var(--chip);display:grid;place-items:center;color:var(--sky);font-weight:800;font-size:22px;flex:none}
.acct .t{font-weight:800;font-size:19px}
.acct .r{margin-left:auto;text-align:right}
.cols{display:grid;grid-template-columns:1.5fr 1fr 1fr 24px;gap:8px;color:var(--mut);font-size:14px;padding:0 6px;margin-bottom:8px}
.cols span:nth-child(2),.cols span:nth-child(3){text-align:right}
.hold{background:var(--card);border:1px solid var(--line);border-radius:20px;margin-bottom:12px;overflow:hidden}
.hrow{display:grid;grid-template-columns:1.5fr 1fr 1fr 24px;gap:8px;align-items:center;width:100%;text-align:left;padding:14px 12px 14px 14px;min-height:64px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:40px;height:40px;border-radius:50%;background:var(--g2);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.tk{font-weight:800;color:var(--sky)}
.nm{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid,.pl{text-align:right;font-weight:700}
.mid small{display:block;color:var(--mut);font-weight:500}
.edit{display:none;grid-template-columns:1fr 1fr;gap:10px;padding:4px 14px 16px}
.hold.open .edit{display:grid}
.hold.open .chev{transform:rotate(180deg)}
.chev{transition:transform .15s}
.edit label,.sheet label{font-size:12px;color:var(--mut);display:block;margin-bottom:3px}
input,select{width:100%;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px}
.del{grid-column:1/-1;color:var(--down);font-weight:700;min-height:40px}
.empty{color:var(--mut);text-align:center;padding:24px}
.note{color:var(--mut);font-size:13px;margin-top:18px}
.tabs{display:flex;gap:8px;margin:0 0 14px}.tabs a{padding:8px 16px;border-radius:99px;background:var(--chip);font-weight:700;font-size:14px}.tabs a.on{background:var(--sky);color:#06202E}.x{color:var(--mut);padding:8px;min-height:40px;font-size:16px}
@media(min-width:1024px){main{max-width:1280px;padding:24px 32px 64px}main.narrow{max-width:640px}}
.dtop{display:flex;align-items:center;gap:16px;margin-bottom:18px}.dtop h1{font-size:26px;font-weight:800;margin:0}.grow{flex:1}
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border:1px solid var(--line);border-radius:20px}
.stat{display:flex;align-items:center;gap:14px;padding:18px 22px;border-left:1px solid var(--line)}.stat:first-child{border-left:0}
.sico{width:44px;height:44px;border-radius:50%;background:var(--chip);display:grid;place-items:center;color:var(--sky);font-weight:800;flex:none}
.sv{font-size:22px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.sv .pill{margin:0;font-size:12px}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;margin-top:20px;align-items:start}
.chips{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.chip{padding:9px 16px;border-radius:99px;background:var(--chip);font-weight:700;font-size:14px}.chip.on{background:var(--sky);color:#06202E}
.thead,.trow{display:grid;grid-template-columns:2.3fr 1fr 1fr .8fr 1.3fr 1.3fr 1.5fr 1.2fr;gap:10px;align-items:center}
.thead{color:var(--mut);font-size:13px;font-weight:600;padding:0 18px 8px}.thead span+span,.trow>div+div{text-align:right}
.trow{padding:14px 18px;min-height:68px;font-weight:600}.trow small{display:block;color:var(--mut);font-weight:500;font-size:12px}.trow small.up{color:var(--up)}.trow small.down{color:var(--down)}
.hold .edit.wide{grid-template-columns:repeat(5,1fr);align-items:end;padding:6px 18px 18px}
.donut{width:200px;height:200px;border-radius:50%;margin:12px auto 0;position:relative}.donut::after{content:"";position:absolute;inset:26px;border-radius:50%;background:var(--card)}.dc{position:absolute;inset:0;display:grid;place-content:center;text-align:center;z-index:1}
.dleg{display:grid;gap:10px;margin-top:16px;font-size:14px}.dleg div{display:flex;align-items:center;gap:8px}.dleg i{width:10px;height:10px;border-radius:50%;flex:none}.dleg b{margin-left:auto}
.sheet{position:fixed;inset:0;background:rgba(5,8,15,.6);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.open{display:flex}
.sheet .in{background:var(--card);width:100%;max-width:480px;border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:1fr 1fr;gap:12px;max-height:92vh;overflow:auto}
.sheet h3{grid-column:1/-1;margin:0;font-size:20px}
.sheet .full{grid-column:1/-1}
.sheet .acts{grid-column:1/-1;display:flex;gap:10px}.sheet .acts button{flex:1}
</style>
</head>
<body>
<main id="app"></main>
<div class="sheet" id="sheet"><div class="in">
  <h3>Add holding</h3>
  <div><label for="fKind">Type</label><select id="fKind"><option value="stock">Stock</option><option value="fund">Fund</option></select></div>
  <div><label for="fMkt">Market</label><select id="fMkt"><option value="PH">Philippines (₱)</option><option value="US">US ($)</option></select></div>
  <div><label for="fTicker">Ticker</label><input id="fTicker" placeholder="e.g. RCR"></div>
  <div><label for="fName">Name</label><input id="fName" placeholder="e.g. RL Commercial REIT"></div>
  <div><label for="fShares">Shares or units</label><input id="fShares" type="number" step="any" min="0" inputmode="decimal"></div>
  <div><label for="fAvg">Average price (₱)</label><input id="fAvg" type="number" step="any" min="0" inputmode="decimal"></div>
  <div><label for="fPrice">Price now (₱, optional)</label><input id="fPrice" type="number" step="any" min="0" inputmode="decimal"></div>
  <div><label for="fDiv">Dividend per share a year (₱)</label><input id="fDiv" type="number" step="any" min="0" inputmode="decimal"></div>
  <div class="acts"><button class="btn soft" id="cancel">Cancel</button><button class="btn" id="save">Save holding</button></div>
</div></div>
<script>
const KEY = "portfolio-v2";
const seed = [
  {id:1, kind:"stock", ticker:"GCASH", name:"Mynt, Inc.", shares:100, avg:7.47, price:7.18, div:0},
  {id:2, kind:"stock", ticker:"RCR", name:"RL Commercial REIT", shares:100, avg:5.9979, price:5.95, div:0.4584},
  {id:3, kind:"fund", ticker:"ATRGTEC", name:"ATRAM Global Technology Feeder Fund", shares:2, avg:522.2, price:494.005, div:0}
];
let items = load(), openId = null, fx = 58, watchl = [], wq = {};
try { fx = +localStorage.getItem("portfolio-fx") || 58; watchl = JSON.parse(localStorage.getItem("portfolio-watch")) || []; } catch(e){}
const saveW = () => { try { localStorage.setItem("portfolio-watch", JSON.stringify(watchl)); } catch(e){} };
function load(){ try { const s = localStorage.getItem(KEY); if (s) return JSON.parse(s); } catch(e){} return seed.map(x => ({...x})); }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(items)); } catch(e){} }
const $ = id => document.getElementById(id);
const money = n => (n < 0 ? "-" : "") + "₱" + Math.abs(n).toLocaleString("en-PH", {minimumFractionDigits:2, maximumFractionDigits:2});
const signed = n => (n > 0 ? "+" : "") + (n < 0 ? "-" : "") + Math.abs(n).toLocaleString("en-PH", {minimumFractionDigits:2, maximumFractionDigits:2});
const num = n => String(+(+n).toFixed(4));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const calc = h => { const m = h.mkt === "US" ? fx : 1, cost = h.shares * h.avg * m, val = h.shares * h.price * m; return {cost, val, pl:val - cost, pct:cost ? (val - cost) / cost * 100 : 0, day: h.chg ? val - val / (1 + h.chg / 100) : 0}; };
const sum = list => { const t = {cost:0, val:0, div:0, day:0}; list.forEach(h => { const c = calc(h); t.cost += c.cost; t.val += c.val; t.day += c.day; t.div += h.shares * h.div * (h.mkt === "US" ? fx : 1); }); t.pl = t.val - t.cost; t.pct = t.cost ? t.pl / t.cost * 100 : 0; return t; };
const pill = p => `<span class="pill ${p >= 0 ? "up" : "down"}">${p >= 0 ? "▲" : "▼"} ${Math.abs(p).toFixed(2)}%</span>`;
const kinds = {stock:{title:"Stock Holdings", sub:"PH Stocks", all:"All Stocks", icon:"₱"}, fund:{title:"Fund Portfolio", sub:"PH Mutual Funds / UITFs", all:"All Funds", icon:"₱"}, us:{title:"US Stocks", sub:"NASDAQ / NYSE, converted to ₱", all:"All US Stocks", icon:"$"}};
const g = h => h.kind === "fund" ? "fund" : h.mkt === "US" ? "us" : "stock", cs = h => h.mkt === "US" ? "$" : "";

const tabs = a => `<div class="tabs"><a class="${a === "home" ? "on" : ""}" href="#home">Portfolio</a><a class="${a === "watch" ? "on" : ""}" href="#watch">Watchlist</a></div>`;
function home(){
  const t = sum(items), G = ["stock","fund","us"].map(k => [k, sum(items.filter(h => g(h) === k))]), cols = ["var(--blue)","var(--teal)","var(--c3)"];
  let a = 0; const stops = G.map(([k,s], i) => { const p = t.val ? s.val / t.val * 100 : 0, seg = `${cols[i]} ${a}% ${a + p}%`; a += p; return seg; }).join(",");
  const acct = ([k, s]) => `<a class="acct ${s.pl >= 0 ? "gain" : ""}" href="#${k}"><div class="ico">${kinds[k].icon}</div><div><div class="t">${kinds[k].title}</div><div class="lbl">${kinds[k].sub}</div></div><div class="r"><div class="val" style="font-size:19px">${money(s.val)}</div>${pill(s.pct)}</div></a>`;
  const leg = G.map(([k, s], i) => `<div><i style="background:${cols[i]}"></i>${kinds[k].title.replace(" Holdings", "").replace(" Portfolio", "s")}<b style="color:${cols[i]}">${t.val ? (s.val / t.val * 100).toFixed(0) : 0}%</b></div>`).join("");
  return `<div class="top"><h1>My portfolio</h1><button class="btn soft" data-refresh>↻ Refresh</button></div>${statusLine()}${tabs("home")}
  <div class="hero"><div><small>Portfolio value</small><div class="big">${money(t.val)}</div><small>Today ${signed(t.day)}${items.some(h => h.mkt === "US") ? " · $1 = ₱" + fx.toFixed(2) : ""}</small></div></div>
  <div class="card row2"><div><div class="lbl">Invested</div><div class="val">${money(t.cost)}</div></div><div><div class="lbl">Total return</div><div class="val ${t.pl >= 0 ? "up" : "down"}">${signed(t.pl)}</div>${pill(t.pct)}</div></div>
  <div class="card"><h2>Portfolio mix</h2><div class="lbl">How your investments are allocated</div>
    <div class="mix"><div class="pie" style="background:conic-gradient(${stops})"></div><div class="leg">${leg}</div></div></div>
  <div class="sechead"><div><h2>Accounts</h2><div class="lbl">All balances in one view</div></div><button class="btn" data-add="stock">+ Add</button></div>
  ${G.map(acct).join("")}
  <p class="note">US holdings are entered in dollars and converted at the live USD to PHP rate. Open an account and tap a holding to edit it. Data is saved in this browser only.</p>`;
}

function watch(){
  const rows = watchl.length ? watchl.map(w => { const q = wq[w.m + ":" + w.t] || {}; return `<div class="hold"><div class="hrow" style="grid-template-columns:1.5fr 1fr 1fr 40px"><div class="who"><div class="logo">${esc(w.t.slice(0, 2))}</div><div><div class="tk">${esc(w.t)}</div><div class="nm">${w.m === "US" ? "US market" : "PSE"}</div></div></div><div class="mid">${q.price ? (w.m === "US" ? "$" : "₱") + num(q.price) : "–"}</div><div class="pl">${q.chg != null ? pill(q.chg) : ""}</div><button class="x" data-wdel="${w.m}:${w.t}" aria-label="Remove ${esc(w.t)}">✕</button></div></div>`; }).join("") : `<div class="empty">Follow stocks you don’t own yet. Try RCR on PSE or NVDA on US.</div>`;
  return `<div class="top"><h1>Watchlist</h1><button class="btn soft" data-refresh>↻ Refresh</button></div>${statusLine()}${tabs("watch")}
  <div class="card" style="display:flex;gap:8px;margin:0 0 14px"><select id="wM" style="width:84px" aria-label="Market"><option>PH</option><option>US</option></select><input id="wT" placeholder="Ticker" aria-label="Ticker" style="text-transform:uppercase"><button class="btn" data-wadd>Add</button></div>${rows}`;
}

function account(k){
  const list = items.filter(h => g(h) === k), t = sum(list), y = t.cost ? t.div / t.cost * 100 : 0;
  const rows = list.length ? list.map(h => { const c = calc(h); return `<div class="hold ${openId === h.id ? "open" : ""}">
    <button class="hrow" data-open="${h.id}" aria-expanded="${openId === h.id}">
      <div class="who"><div class="logo">${esc(h.ticker.slice(0,2))}</div><div style="min-width:0"><div class="tk">${esc(h.ticker)}</div><div class="nm">${esc(h.name)}</div></div></div>
      <div class="mid">${cs(h)}${num(h.avg)}<small>${num(h.shares)}</small></div>
      <div class="pl ${c.pl >= 0 ? "up" : "down"}">${signed(c.pl)}<br>${pill(c.pct)}</div>
      <span class="chev">⌄</span></button>
    <div class="edit">
      <div><label>Shares or units</label><input type="number" step="any" min="0" inputmode="decimal" value="${h.shares}" data-id="${h.id}" data-f="shares"></div>
      <div><label>Average price</label><input type="number" step="any" min="0" inputmode="decimal" value="${h.avg}" data-id="${h.id}" data-f="avg"></div>
      <div><label>Price now</label><input type="number" step="any" min="0" inputmode="decimal" value="${h.price}" data-id="${h.id}" data-f="price"></div>
      <div><label>Dividend per share a year</label><input type="number" step="any" min="0" inputmode="decimal" value="${h.div}" data-id="${h.id}" data-f="div"></div>
      <button class="del" data-del="${h.id}">Remove ${esc(h.ticker)}</button>
    </div></div>`; }).join("") : `<div class="empty">Nothing here yet. Tap + to add your first holding.</div>`;
  return `<div class="top"><a class="back" href="#home" aria-label="Back to portfolio">←</a><h1>${kinds[k].title}</h1><button class="btn soft" data-refresh aria-label="Refresh prices">↻</button></div>${statusLine()}
  <div class="hero"><div><small>Portfolio value</small><div class="big">${money(t.val)}</div></div><button class="plus" data-add="${k}" aria-label="Add holding">+</button></div>
  <div class="card row2"><div><div class="lbl">Total return</div><div class="val ${t.pl >= 0 ? "up" : "down"}">${signed(t.pl)}</div>${pill(t.pct)}</div>
  <div><div class="lbl">Est. dividend per year</div><div class="val">${money(t.div)}</div><span class="pill neutral">${y.toFixed(2)}%</span></div></div>
  <div class="sechead"><h2>${kinds[k].all}</h2></div>
  <div class="cols"><span>Holding</span><span>Avg. price</span><span>Profit</span><span></span></div>${rows}`;
}

const wide = () => matchMedia("(min-width:1024px)").matches;
const pal = ["var(--blue)","var(--teal)","var(--c3)","#E0A526","#E0697C","#7FB84A","#4FC3C8","#C98B5A"];
function dash(r){
  const f = ["stock","fund","us"].includes(r) ? r : "all", list = items.filter(h => f === "all" || g(h) === f), all = sum(items), tv = sum(list).val;
  const dayPct = all.val - all.day ? all.day / (all.val - all.day) * 100 : 0, yld = all.cost ? all.div / all.cost * 100 : 0;
  const stat = (ico, lbl, v, p) => `<div class="stat"><div class="sico">${ico}</div><div><div class="lbl">${lbl}</div><div class="sv">${v}${p || ""}</div></div></div>`;
  const chips = [["all","All"],["stock","PH Stocks"],["fund","Funds"],["us","US Stocks"]].map(([k, l]) => `<a class="chip ${f === k ? "on" : ""}" href="#${k === "all" ? "home" : k}">${l}</a>`).join("");
  const rows = list.map(h => { const c = calc(h), dv = h.shares * h.div * (h.mkt === "US" ? fx : 1), o = openId === h.id; return `<div class="hold ${o ? "open" : ""}"><button class="hrow trow" data-open="${h.id}" aria-expanded="${o}">
    <div class="who"><div class="logo">${esc(h.ticker.slice(0, 2))}</div><div style="min-width:0"><div class="tk">${esc(h.ticker)}</div><div class="nm">${esc(h.name)}</div></div></div>
    <div>${cs(h)}${num(h.price)}${h.chg != null ? `<small class="${h.chg >= 0 ? "up" : "down"}">${h.chg >= 0 ? "▲" : "▼"} ${Math.abs(h.chg).toFixed(2)}% today</small>` : ""}</div>
    <div>${cs(h)}${num(h.avg)}</div><div>${num(h.shares)}</div><div>${money(c.val)}</div><div>${money(c.cost)}</div>
    <div class="${c.pl >= 0 ? "up" : "down"}">${signed(c.pl)}<br>${pill(c.pct)}</div><div>${money(dv)}<small>per year</small></div></button>
    <div class="edit wide">${["shares:Shares or units","avg:Average price","price:Price now","div:Dividend per share a year"].map(x => { const [k, l] = x.split(":"); return `<div><label>${l}</label><input type="number" step="any" min="0" inputmode="decimal" value="${h[k]}" data-id="${h.id}" data-f="${k}"></div>`; }).join("")}<button class="del" style="grid-column:auto" data-del="${h.id}">Remove ${esc(h.ticker)}</button></div></div>`; }).join("") || `<div class="empty">Nothing here yet. Use + Add to enter your first holding.</div>`;
  const al = list.map(h => [h, calc(h).val]).sort((a, b) => b[1] - a[1]); let a0 = 0;
  const stops = al.map(([h, v], i) => { const p = tv ? v / tv * 100 : 0, sg = `${pal[i % pal.length]} ${a0}% ${a0 + p}%`; a0 += p; return sg; }).join(",") || "var(--line) 0 100%";
  const top = al[0], topP = top && tv ? top[1] / tv * 100 : 0;
  const leg = al.map(([h, v], i) => `<div><i style="background:${pal[i % pal.length]}"></i>${esc(h.ticker)}<b>${tv ? (v / tv * 100).toFixed(1) : "0.0"}%</b></div>`).join("");
  const wl = watchl.slice(0, 6).map(w => { const q = wq[w.m + ":" + w.t] || {}; return `<div><i style="background:var(--line)"></i>${esc(w.t)}<b>${q.price ? (w.m === "US" ? "$" : "₱") + num(q.price) : "–"}${q.chg != null ? " " + (q.chg >= 0 ? "▲" : "▼") + Math.abs(q.chg).toFixed(1) + "%" : ""}</b></div>`; }).join("") || `<div class="lbl">Nothing followed yet.</div>`;
  return `<div class="dtop"><h1>My portfolio</h1>${tabs("home")}<span class="grow"></span><span class="lbl">${esc(status)}</span><button class="btn soft" data-refresh>↻ Refresh</button></div>
  <div class="stats">${stat("₱", "Total Portfolio Value", money(all.val))}${stat("↗", "All Time Profit", signed(all.pl), pill(all.pct))}${stat("◔", "Day Change", signed(all.day), pill(dayPct))}${stat("%", "Est. Dividend on Cost", money(all.div) + '<span class="lbl">/yr</span>', `<span class="pill neutral">${yld.toFixed(2)}% annual</span>`)}</div>
  <div class="dgrid"><div><div class="chips">${chips}<span class="grow"></span><button class="btn" data-add="${f === "all" ? "stock" : f}">+ Add</button></div>
  <div class="thead"><span>Holding</span><span>Last price</span><span>Avg. price</span><span>Shares</span><span>Market value</span><span>Total cost</span><span>Total profit/loss</span><span>Div. income</span></div>${rows}
  <p class="note">US holdings are entered in dollars and shown in pesos at ${fx.toFixed(2)} per dollar. Click a holding to edit it.</p></div>
  <aside><div class="card" style="margin-top:0"><h2>Portfolio Allocation</h2><div class="donut" style="background:conic-gradient(${stops})"><div class="dc"><b style="font-size:26px">${topP.toFixed(1)}%</b><span class="lbl">${top ? esc(top[0].ticker) : ""}</span></div></div><div class="dleg">${leg}</div></div>
  <div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font-size:18px">Watchlist</h2><a class="lbl" href="#watch">Open →</a></div><div class="dleg">${wl}</div></div></aside></div>`;
}

function render(){
  const r = location.hash.slice(1), w = wide();
  $("app").className = w && r === "watch" ? "narrow" : "";
  $("app").innerHTML = w && r !== "watch" ? dash(r) : r === "watch" ? watch() : ["stock","fund","us"].includes(r) ? account(r) : home();
}
matchMedia("(min-width:1024px)").addEventListener("change", render);
window.addEventListener("hashchange", () => { openId = null; render(); window.scrollTo(0, 0); });

$("app").addEventListener("click", e => {
  const a = e.target.closest("[data-add]"), o = e.target.closest("[data-open]"), d = e.target.closest("[data-del]");
  if (a){ $("fKind").value = a.dataset.add === "fund" ? "fund" : "stock"; $("fMkt").value = a.dataset.add === "us" ? "US" : "PH"; ["fTicker","fName","fShares","fAvg","fPrice","fDiv"].forEach(i => $(i).value = ""); $("sheet").classList.add("open"); $("fTicker").focus(); }
  if (o){ openId = openId == o.dataset.open ? null : +o.dataset.open; render(); }
  if (d){ const h = items.find(x => x.id == d.dataset.del); if (confirm("Remove " + h.ticker + " from your portfolio?")){ items = items.filter(x => x.id != h.id); openId = null; save(); render(); } }
});
$("app").addEventListener("change", e => {
  const id = e.target.dataset.id; if (!id) return;
  const n = parseFloat(e.target.value), h = items.find(x => x.id == id);
  if (!isNaN(n) && n >= 0){ h[e.target.dataset.f] = n; save(); }
  render();
});
$("cancel").onclick = () => $("sheet").classList.remove("open");
$("save").onclick = () => {
  const ticker = $("fTicker").value.trim().toUpperCase(), shares = parseFloat($("fShares").value), avg = parseFloat($("fAvg").value);
  if (!ticker || isNaN(shares) || isNaN(avg)){ $("fTicker").focus(); return; }
  const price = parseFloat($("fPrice").value);
  items.push({id:Date.now(), kind:$("fKind").value, mkt:$("fKind").value === "fund" ? "PH" : $("fMkt").value, ticker, name:$("fName").value.trim() || ticker, shares, avg, price:isNaN(price) ? avg : price, div:parseFloat($("fDiv").value) || 0});
  save(); $("sheet").classList.remove("open"); location.hash = g(items[items.length - 1]); render();
};
let status = "Prices are manual until live prices load.", timer = null;
const statusLine = () => `<div class="lbl" style="margin:-8px 2px 12px">${esc(status)}</div>`;
const key = h => (h.kind === "fund" ? "FUND" : h.mkt || "PH") + ":" + h.ticker;
async function refresh(manual){
  try {
    const keys = [...new Set([...items.map(key), ...watchl.map(w => w.m + ":" + w.t)])];
    const r = await fetch("/api/prices?t=" + encodeURIComponent(keys.join(",")), {cache:"no-store"}); if (!r.ok) throw new Error("bad status");
    const d = await r.json(), q = d.quotes || {}, good = k => q[k] && q[k].price > 0;
    if (d.fx > 0){ fx = d.fx; try { localStorage.setItem("portfolio-fx", fx); } catch(e){} }
    items.forEach(h => { const k = key(h); if (good(k)){ h.price = q[k].price; if (q[k].chg != null) h.chg = q[k].chg; } });
    watchl.forEach(w => { wq[w.m + ":" + w.t] = q[w.m + ":" + w.t] || {}; });
    save();
    const miss = items.filter(h => !good(key(h))).map(h => h.ticker);
    status = "Live prices updated " + new Date().toLocaleTimeString("en-PH", {hour:"2-digit", minute:"2-digit"}) + (miss.length ? " (no price for " + miss.join(", ") + ")" : "");
    if (!timer) timer = setInterval(() => { if (!document.hidden) refresh(false); }, 60000);
  } catch(e){ if (manual) status = "Couldn’t load live prices. Try again in a moment."; }
  if (!document.activeElement || document.activeElement.tagName !== "INPUT") render();
}
document.addEventListener("click", e => {
  if (e.target.closest("[data-wadd]")){ const t = $("wT").value.trim().toUpperCase(), m = $("wM").value; if (/^[A-Z0-9.\-]{1,10}$/.test(t) && !watchl.some(w => w.t === t && w.m === m)){ watchl.push({t, m}); saveW(); render(); refresh(false); } }
  const x = e.target.closest("[data-wdel]"); if (x){ watchl = watchl.filter(w => w.m + ":" + w.t !== x.dataset.wdel); saveW(); render(); }
});
document.addEventListener("click", e => { if (e.target.closest("[data-refresh]")) refresh(true); });
render();
refresh(false);
</script>
</body>
</html>
